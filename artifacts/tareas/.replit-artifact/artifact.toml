kind = "web"
previewPath = "/"
title = "Tareas"
description = "Aplicación escolar para que un profesor publique tareas por curso y los estudiantes consulten fechas de presentación desde cualquier dispositivo."
version = "1.0.0"
id = "artifacts/tareas"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25518

[services.development]
run = "pnpm --filter @workspace/tareas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tareas", "run", "build" ]
serve = "static"
publicDir = "artifacts/tareas/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25518"
BASE_PATH = "/"
